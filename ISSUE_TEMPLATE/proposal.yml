name: Proposal
description: Propose a feature or a change to the security model.
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: guarantees
    attributes:
      label: Impact on security guarantees
      description: Does this add, weaken or change any guarantee in the threat model? How would we test it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
