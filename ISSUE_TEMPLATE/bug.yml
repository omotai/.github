name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Security issue? Stop here and follow SECURITY.md instead."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Minimal steps, commands or config. Remove any secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, Docker version, LLM provider/model if relevant.
